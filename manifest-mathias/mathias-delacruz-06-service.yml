# kubectl apply -f mathias-delacruz-06-service.yml
apiVersion: v1
kind: Service
metadata:
  name: mathias-delacruz-06-service
  namespace: mathias-delacruz-06-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001       # Puerto que el Service expondrá
    targetPort: 8081  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30001   # Puerto asignado en el nodo, opcional
  selector:
    app: mathias-delacruz-06-deployment  

# Debe coincidir con las etiquetas del Deployment