name: DockerHub CI - Nayeli

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Login a DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME_NAYELI }}
        password: ${{ secrets.DOCKERHUB_TOKEN_NAYELI }}

    - name: Construir imagen Docker
      run: |
        docker build -t nayeliherreraalbino/mi-app:1.0 -f dockerfile-nayeli/Dockerfile .

    - name: Subir imagen a DockerHub
      run: |
        docker push nayeliherreraalbino/mi-app:1.0
